<!DOCTYPE html>
<html lang="de-DE">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Online bestellen | Mesopotamia Neuhaus</title>
<link rel="canonical" href="https://realsyncdynamics-spec.github.io/mesopotamia-neuhaus/bestellen.html"/>
<style>
:root{--bg:#140e0a;--card:#23180f;--gold:#d4a24a;--cream:#f6ecd8;--muted:#cbbca6;--line:#3a2a1c}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--cream);line-height:1.45}
a{color:var(--gold);text-decoration:none}
header{padding:1rem 1.1rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:#140e0ae6;z-index:5;display:flex;justify-content:space-between;align-items:center}
h1{font-size:1.15rem}h2{color:var(--gold);font-size:1.05rem;margin:1rem 0 .5rem}
main{max-width:980px;margin:0 auto;padding:1rem 1.1rem 8rem}
.note{color:var(--muted);font-size:.9rem}
.search{width:100%;padding:.7rem .9rem;border-radius:12px;border:1px solid var(--line);background:#1b130d;color:var(--cream);margin:.7rem 0}
.cats{display:flex;gap:.4rem;overflow:auto}
.cats button{background:transparent;color:var(--cream);border:1px solid var(--line);border-radius:999px;padding:.3rem .7rem;white-space:nowrap}
.cats button.on{border-color:var(--gold);color:var(--gold)}
.item{display:grid;grid-template-columns:1fr auto;gap:.5rem;padding:.55rem 0;border-bottom:1px solid #2c2118}
.name{font-weight:650}.id{color:#8a7a66;margin-right:.35rem}.price{color:#e8c97a}
.btn,.qty button{background:var(--gold);color:#1a120c;border:0;border-radius:999px;font-weight:700;padding:.35rem .7rem;cursor:pointer}
.ghost{background:transparent;color:var(--cream);border:1px solid var(--gold)}
.qty{display:flex;gap:.3rem;align-items:center}
#cartbar{position:fixed;bottom:0;left:0;right:0;background:#23180f;border-top:1px solid var(--line);padding:.7rem 1rem;display:flex;justify-content:space-between}
dialog{border:1px solid var(--line);background:var(--card);color:var(--cream);border-radius:16px;padding:1.1rem;max-width:520px;width:calc(100% - 1.5rem)}
label,input,select,textarea{display:block;width:100%;margin-top:.45rem}
input,select,textarea{padding:.55rem .7rem;border-radius:10px;border:1px solid var(--line);background:#1b130d;color:var(--cream)}
.check{display:flex;gap:.55rem}.check input{width:auto}.err{color:#e07a7a}
</style></head>
<body>
<header><div><a href="./">← Start</a><h1>Online bestellen</h1></div>
<button class="btn ghost" id="openCart">Warenkorb <span id="badge">0</span></button></header>
<main>
<p class="note">Kein Server, keine Zahlung hier. Abschluss nur per WhatsApp nach Datenschutz-Haken. Bestätigung durch den Laden.</p>
<input class="search" id="q" placeholder="Suchen …"/>
<div class="cats" id="cats"></div><div id="list"></div>
</main>
<div id="cartbar"><span id="sum">0,00 €</span><button class="btn" id="goCheck">Zur Kasse</button></div>
<dialog id="dlg">
<h2>Kasse</h2><div id="cartLines" class="note"></div>
<label>Abholung oder Lieferung<select id="mode"><option value="abholung">Abholung</option><option value="lieferung">Lieferung</option></select></label>
<label id="zoneWrap" style="display:none">Liefergebiet<select id="zone">
<option value="neuhaus">Neuhaus · min 15 € · +1 €</option>
<option value="lichte">Lichte / Ernstthal / Lauscha · min 20 € · +2 €</option>
<option value="schmiede">Schmiedefeld / Piesau / Oberweißbach / Deesbach · min 25 € · +3 €</option>
<option value="steinheid">Steinheid / Meuselbach / Cursdorf · min 30 € · +3 €</option>
<option value="scheibe">Scheibe-Alsbach / Siegmundsburg · min 40 € · +4 €</option>
<option value="steinach">Steinach / Katzhütte · min 40 € · +4 €</option>
</select></label>
<label>Name <input id="name" autocomplete="name"/></label>
<label>Telefon <input id="tel" autocomplete="tel"/></label>
<label id="addrWrap" style="display:none">Lieferadresse <input id="addr"/></label>
<label>Wunschzeit <input id="when"/></label>
<label>Hinweis <textarea id="note" rows="2"></textarea></label>
<p class="note" id="totals"></p><p class="err" id="err"></p>
<label class="check"><input type="checkbox" id="ok"/><span>Ich bestelle per WhatsApp und habe die <a href="./datenschutz.html">Datenschutzhinweise</a> gelesen.</span></label>
<p style="margin-top:1rem"><button class="btn" id="send">Per WhatsApp senden</button>
<button class="ghost btn" id="close">Zurück</button></p>
</dialog>
<script src="./bestellen.js"></script>
</body></html>
